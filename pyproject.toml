[project]
name = "pola"
version = "0.0.1"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "Calculate critical bandwidth for bimodal distributions in kernel density estimation"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "numpy>=1.21",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "scipy>=1.7",
]

[project.urls]
"Homepage" = "https://github.com/ryZhangHason/Polarization-CBW"
"Bug Tracker" = "https://github.com/ryZhangHason/Polarization-CBW/issues"

[project.scripts]
pola = "pola.cli:main"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=critical_bandwidth --cov-report=term-missing"
