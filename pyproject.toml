[project]
name = "critband"
version = "0.2.3"
authors = [
  { name = "Ruiyu Zhang" },
  { name = "Qihao Wang" },
]

description = "Calculate critical bandwidth for bimodal distributions in kernel density estimation"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "bimodality",
    "critical bandwidth",
    "kernel density estimation",
    "Silverman test",
    "dip test",
    "multimodality",
    "statistics",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.7",
    "xlrd>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "reportlab>=4.0",
    "xlwt>=1.3",
    "sphinx>=8.1.3",
    "furo>=2025.12.19",
]
viz = [
    "matplotlib>=3.5",
]
jupyter = [
    "ipykernel>=6.0",
    "notebook>=7.0",
]

[project.urls]
Homepage = "https://github.com/ryZhangHason/critband"
"Bug Tracker" = "https://github.com/ryZhangHason/critband/issues"
Documentation = "https://github.com/ryZhangHason/critband"
Source = "https://github.com/ryZhangHason/critband"
Paper = "https://arxiv.org/abs/2605.18686"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["critband", "critband.*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=critband --cov-report=term-missing"
